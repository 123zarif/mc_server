# AuthMeVelocity Proxy Configuration
# https://github.com/4drian3d/AuthMeVelocity

# List of login/registration servers
auth-servers = [
    "auth",
     "survival",
    "pvp"
]

ensure-auth-server {
    # Ensure that the first server to which players connect is an auth server
    ensure-auth-server = true
    # Selection Mode of the player's initial server (TO_FIRST, TO_EMPTIEST_SERVER, RANDOM)
    send-mode = "TO_FIRST"
}



send-on-login {
    # Send logged in players to another server?
    send-on-login = true
    # Require players to have the authmevelocity.send-on-login permission?
    require-permission = false
    # Selection Mode of the destination server
    send-mode = "TO_FIRST"
    # List of servers to send players to after successful login
    teleport-servers = [
        "survival"
    ]
}

commands {
    # Commands allowed before authentication
    allowed-commands = [
        "login",
        "register",
        "l",
        "reg",
        "email",
        "captcha"
    ]
    # Message sent when an unauthorized command is executed
    blocked-message = "<red>You cannot execute commands until you are logged in!</red>"
}

advanced {
    debug = false
    random-attempts = 5
}
