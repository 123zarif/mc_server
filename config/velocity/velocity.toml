# ===================================================================
# Velocity Configuration Template
# Synced and populated with ${CFG_*} environment variables on boot
# ===================================================================

config-version = "2.7"
bind = "0.0.0.0:25577"
motd = "${CFG_PROXY_MOTD}"
show-max-players = 500
online-mode = false
force-key-authentication = false
prevent-client-proxy-connections = false

# Player Information Forwarding: modern (with forwarding-secret)
player-info-forwarding-mode = "modern"
forwarding-secret = "${CFG_FORWARDING_SECRET}"
announce-forge = false
kick-existing-players = false
ping-passthrough = "DISABLED"
enable-player-address-logging = true

[servers]
auth = "mc-auth:25565"
survival = "mc-survival:25565"
pvp = "mc-pvp:25565"

# Fallback sequence when players connect
try = ["auth"]

[forced-hosts]
# "survival.example.com" = [ "survival" ]
# "pvp.example.com" = [ "pvp" ]

[advanced]
compression-threshold = 256
compression-level = -1
login-ratelimit = 3000
connection-timeout = 5000
read-timeout = 30000
haproxy-protocol = false
tcp-fast-open = true
bungee-plugin-message-channel = true
show-ping-requests = false
failover-on-unexpected-server-disconnect = true
announce-proxy-commands = true
log-command-executions = false

[query]
enabled = false
port = 25577
map = "Velocity"
show-plugins = false
