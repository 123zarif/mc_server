services:
  # =================================================================
  # 1. GATEWAY & PROXY LAYER
  # =================================================================
  velocity:
    image: itzg/mc-proxy:latest
    container_name: mc-velocity
    restart: unless-stopped
    ports:
      - "${MINECRAFT_JAVA_PORT:-25565}:25577"
      - "${MINECRAFT_BEDROCK_PORT:-19132}:${MINECRAFT_BEDROCK_PORT:-19132}/udp"
    environment:
      TYPE: "VELOCITY"
      MEMORY: "${VELOCITY_MEMORY:-512M}"
      TZ: "${TZ:-UTC}"
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/velocity
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/velocity
        https://cdn.modrinth.com/data/Q10irTG0/versions/7gyD0ard/Velocitab-1.7.11-b34b3ec.jar
        https://cdn.modrinth.com/data/sG6SrXta/versions/1Gy7jBHC/AuthMeVelocity-Velocity-4.3.0.jar
      REPLACE_ENV_VARIABLES: "true"
      REPLACE_ENV_VARIABLE_PREFIX: "CFG_"
      CFG_FORWARDING_SECRET: "${FORWARDING_SECRET:?Set FORWARDING_SECRET in .env}"
      CFG_PROXY_MOTD: "${PROXY_MOTD:-Welcome to our Minecraft Network!}"
    volumes:
      - ./proxy-data:/server
      - ./config/velocity/velocity.toml:/server/velocity.toml
    networks:
      - internal_net

  # Server Authentication and Stuff...

  mc-auth:
    image: itzg/minecraft-server:java25
    container_name: mc-auth
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: "PURPUR"
      VERSION: "26.2"
      MEMORY: "768M" # Capped low - 768M is plenty
      ONLINE_MODE: "FALSE"

      # Disable all entity processing & ticking overhead
      VIEW_DISTANCE: 2
      SPAWN_MONSTERS: "FALSE"
      SPAWN_ANIMALS: "FALSE"
      SPAWN_NPCS: "FALSE"
      ALLOW_NETHER: "FALSE"
      GENERATE_STRUCTURES: "FALSE"
      LEVEL_TYPE: "flat"

      # Only 2 plugins: Floodgate & AuthMe
      MODRINTH_PROJECTS: "placeholderapi,authmevelocity"
      PLUGINS: |
        https://github.com/AuthMe/AuthMeReloaded/releases/download/6.0.1/AuthMe-6.0.1-Spigot-1.21.jar
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/velocity

      # Share the database env variables for AuthMe
      REPLACE_ENV_VARIABLES: "TRUE"
      ENV_VARIABLE_PREFIX: "CFG_"
      CFG_DB_HOST: "postgres"
      CFG_DB_PORT: "5432"
      CFG_DB_USER: "${POSTGRES_USER}"
      CFG_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      CFG_DB_NAME: "${POSTGRES_DB}"

    volumes:
      - auth_data:/data
      - ./templates/auth:/config:ro
    networks:
      - internal_net

  # =================================================================
  # 2. MINECRAFT BACKEND NODES
  # =================================================================
  mc-survival:
    image: itzg/minecraft-server:java25
    container_name: mc-survival
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "${VOICE_CHAT_PORT:-24454}:24454/udp"
    environment:
      EULA: "TRUE"
      TYPE: "${MC_TYPE:-PURPUR}"
      VERSION: "${MC_VERSION:-LATEST}"
      MEMORY: "${SURVIVAL_MEMORY:-10G}"
      USE_AIKAR_FLAGS: "true"
      ONLINE_MODE: "FALSE"
      DIFFICULTY: "${MC_DIFFICULTY:-hard}"
      TZ: "${TZ:-UTC}"
      MODRINTH_PROJECTS: "luckperms,chunky,squaremap,placeholderapi,syncmoney,authmevelocity"
      PLUGINS: |
        https://zrips.net/Residence/download.php?file=Residence6.0.3.3.jar
        https://www.zrips.net/CMILib/CMILib1.6.0.1.jar 
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
        https://github.com/AuthMe/AuthMeReloaded/releases/download/6.0.1/AuthMe-6.0.1-Spigot-1.21.jar
        https://github.com/EssentialsX/Essentials/releases/download/2.22.0/EssentialsX-2.22.0.jar
        https://github.com/EssentialsX/Essentials/releases/download/2.22.0/EssentialsXChat-2.22.0.jar
        https://cdn.modrinth.com/data/LJNGWSvH/versions/Gd6BG1HA/grimac-bukkit-2.3.74-8eb5f28.jar
      # Config template synchronization and variable replacement
      REPLACE_ENV_VARIABLES: "TRUE"
      ENV_VARIABLE_PREFIX: "CFG_"
      REPLACE_ENV_DURING_SYNC: "true"
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
      CFG_FORWARDING_SECRET: "${FORWARDING_SECRET:?Set FORWARDING_SECRET in .env}"
      CFG_SURVIVAL_MOTD: "${SURVIVAL_MOTD:-Custom Survival Network}"
      CFG_DB_HOST: "postgres"
      CFG_DB_PORT: "5432"
      CFG_DB_NAME: "${POSTGRES_DB:-mc_network}"
      CFG_DB_USER: "${POSTGRES_USER:-mc_admin}"
      CFG_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      CFG_REDIS_HOST: "redis"
      CFG_REDIS_PORT: "6379"
    volumes:
      - ./survival-data:/data
      - ./config/survival:/config:ro
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          memory: "${SURVIVAL_MEMORY_LIMIT:-12G}"

  mc-pvp:
    image: itzg/minecraft-server:java25
    container_name: mc-pvp
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      EULA: "TRUE"
      TYPE: "${MC_TYPE:-PURPUR}"
      VERSION: "${MC_VERSION:-LATEST}"
      MEMORY: "${PVP_MEMORY:-3G}"
      USE_AIKAR_FLAGS: "true"
      ONLINE_MODE: "FALSE"
      DIFFICULTY: "${MC_DIFFICULTY:-hard}"
      VIEW_DISTANCE: "${PVP_VIEW_DISTANCE:-6}"
      SIMULATION_DISTANCE: "${PVP_SIM_DISTANCE:-4}"
      TZ: "${TZ:-UTC}"
      MODRINTH_PROJECTS: "luckperms,placeholderapi,authmevelocity"
      PLUGINS: |
        https://github.com/AuthMe/AuthMeReloaded/releases/download/6.0.1/AuthMe-6.0.1-Spigot-1.21.jar
        https://github.com/EssentialsX/Essentials/releases/download/2.22.0/EssentialsX-2.22.0.jar
        https://github.com/EssentialsX/Essentials/releases/download/2.22.0/EssentialsXChat-2.22.0.jar
        https://cdn.modrinth.com/data/LJNGWSvH/versions/Gd6BG1HA/grimac-bukkit-2.3.74-8eb5f28.jar
      # Config template synchronization and variable replacement
      REPLACE_ENV_VARIABLES: "TRUE"
      ENV_VARIABLE_PREFIX: "CFG_"
      REPLACE_ENV_DURING_SYNC: "true"
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
      CFG_FORWARDING_SECRET: "${FORWARDING_SECRET:?Set FORWARDING_SECRET in .env}"
      CFG_PVP_MOTD: "${PVP_MOTD:-Custom PvP Arena}"
      CFG_DB_HOST: "postgres"
      CFG_DB_PORT: "5432"
      CFG_DB_NAME: "${POSTGRES_DB:-mc_network}"
      CFG_DB_USER: "${POSTGRES_USER:-mc_admin}"
      CFG_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      CFG_REDIS_HOST: "redis"
      CFG_REDIS_PORT: "6379"
    volumes:
      - ./pvp-data:/data
      - ./config/pvp:/config:ro
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          memory: "${PVP_MEMORY_LIMIT:-4G}"

  # =================================================================
  # 3. PERSISTENCE & CACHING LAYER
  # =================================================================
  postgres:
    image: postgres:16-alpine
    container_name: mc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-mc_network}"
      POSTGRES_USER: "${POSTGRES_USER:-mc_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      TZ: "${TZ:-UTC}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: mc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          memory: 512M

