  #     DATABASE_URL: "postgresql://${POSTGRES_USER:-mc_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mc_network}"
  #     REDIS_URL: "redis://redis:6379"
