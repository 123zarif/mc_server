  #     resources:
  #       limits:
  #         memory: 256M

  # # =================================================================
  # # 5. WEB GATEWAY (Caddy)
  # # =================================================================
  # web:
  #   image: caddy:alpine
  #   container_name: mc-web
  #   restart: unless-stopped
