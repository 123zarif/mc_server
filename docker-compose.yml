services:
  # =================================================================
  # 1. GATEWAY & PROXY LAYER
  # =================================================================
  velocity:
    image: itzg/mc-proxy:latest
    container_name: mc-velocity
    restart: unless-stopped
    ports:
      - "${MINECRAFT_JAVA_PORT:-25565}:25577"
      - "${MINECRAFT_BEDROCK_PORT:-19132}:${MINECRAFT_BEDROCK_PORT:-19132}/udp"
    environment:
      TYPE: "VELOCITY"
      MEMORY: "${VELOCITY_MEMORY:-512M}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ./proxy-data:/server
    networks:
      - internal_net

  # =================================================================
  # 2. MINECRAFT BACKEND NODES
  # =================================================================
  mc-survival:
    image: itzg/minecraft-server:java25
    container_name: mc-survival
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "${VOICE_CHAT_PORT:-24454}:24454/udp"
    environment:
      EULA: "TRUE"
      TYPE: "${MC_TYPE:-PURPUR}"
      VERSION: "${MC_VERSION:-LATEST}"
      MEMORY: "${SURVIVAL_MEMORY:-10G}"
      USE_AIKAR_FLAGS: "true"
      ONLINE_MODE: "FALSE"
      DIFFICULTY: "${MC_DIFFICULTY:-hard}"
      VIEW_DISTANCE: "${SURVIVAL_VIEW_DISTANCE:-8}"
      SIMULATION_DISTANCE: "${SURVIVAL_SIM_DISTANCE:-6}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ./survival-data:/data
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          memory: "${SURVIVAL_MEMORY_LIMIT:-12G}"

  mc-pvp:
    image: itzg/minecraft-server:java25
    container_name: mc-pvp
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      EULA: "TRUE"
      TYPE: "${MC_TYPE:-PURPUR}"
      VERSION: "${MC_VERSION:-LATEST}"
      MEMORY: "${PVP_MEMORY:-3G}"
      USE_AIKAR_FLAGS: "true"
      ONLINE_MODE: "FALSE"
      DIFFICULTY: "${MC_DIFFICULTY:-hard}"
      VIEW_DISTANCE: "${PVP_VIEW_DISTANCE:-6}"
      SIMULATION_DISTANCE: "${PVP_SIM_DISTANCE:-4}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ./pvp-data:/data
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          memory: "${PVP_MEMORY_LIMIT:-4G}"

  # =================================================================
  # 3. PERSISTENCE & CACHING LAYER
  # =================================================================
  postgres:
    image: postgres:16-alpine
    container_name: mc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-mc_network}"
      POSTGRES_USER: "${POSTGRES_USER:-mc_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      TZ: "${TZ:-UTC}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: mc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          memory: 512M

  # # =================================================================
  # # 4. RUST SERVICE (Axum API + Discord Bot)
  # # =================================================================
  # rust-backend:
  #   build:
  #     context: ./rust-backend
  #     dockerfile: Dockerfile
